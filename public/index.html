                    <span id="remote-connected-label" style="font-size:12px;color:var(--muted)"></span>
                    <button class="reset-btn" id="remote-switch-btn" style="margin-left:8px">Switch server…</button>
                  </div>
                </div>
                <div>
                  <button class="reset-btn" id="reset-settings-btn">Reset to defaults</button>
                </div>
              </div>
            </div>
          </div>
          <div id="project-sections"></div>
          <div id="qr-overlay" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.75);align-items:center;justify-content:center">
            <div style="background:var(--header-bg);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:360px;width:90%;text-align:center">
              <h2 style="font-size:16px;color:var(--accent-hover);margin-bottom:12px">Scan to open ai-tabs</h2>
              <select id="qr-url-select" style="width:100%;padding:6px 8px;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-size:13px;margin-bottom:12px"></select>
              <div style="background:#fff;border-radius:8px;padding:12px;display:flex;justify-content:center">
                <img id="qr-image" alt="QR code" style="width:240px;height:240px;display:block">
              </div>
              <div id="qr-url-text" style="font-family:monospace;font-size:11px;color:var(--muted);margin-top:10px;word-break:break-all"></div>
              <div style="display:flex;justify-content:flex-end;margin-top:12px">
                <button id="qr-close-btn" class="reset-btn">Close</button>
              </div>
            </div>
          </div>
          <div id="password-setup-overlay" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.75);align-items:center;justify-content:center">
            <div style="background:var(--header-bg);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:420px;width:90%">
              <h2 style="font-size:18px;color:var(--accent-hover);margin-bottom:8px">Set a remote-access password</h2>
              <p style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5">
                Phone and tablet browsers will use this to connect to this machine. Leave blank to skip — remote access will stay disabled.
              </p>
              <input id="setup-password-input" type="password" autocomplete="new-password" placeholder="New password (12+ chars)"
                style="width:100%;padding:10px 12px;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-size:14px;margin-bottom:12px">
              <div id="setup-password-error" style="color:var(--danger);font-size:12px;margin-bottom:12px;display:none"></div>
              <div style="display:flex;gap:8px;justify-content:flex-end">
                <button id="setup-password-skip" class="reset-btn">Skip</button>
                <button id="setup-password-save" class="reset-btn" style="background:var(--accent);color:white;border-color:var(--accent)">Save</button>
              </div>
            </div>
          </div>
        </div>
      `;

      // ── Apply theme to landing page ──
      function applyThemeToPage(preset) {
        const r = document.documentElement.style;
        r.setProperty('--bg', preset.terminal.background);
        r.setProperty('--fg', preset.terminal.foreground);
        r.setProperty('--accent', preset.ui.accent);
        r.setProperty('--accent-hover', preset.ui.accentHover);
        r.setProperty('--header-bg', preset.ui.headerBg);
        r.setProperty('--card-hover-bg', preset.ui.cardHoverBg);
        r.setProperty('--border', preset.ui.borderColor);
        r.setProperty('--muted', preset.ui.mutedText);
        r.setProperty('--input-bg', preset.ui.inputBg);
        r.setProperty('--deep-bg', preset.ui.deepBg);
        r.setProperty('--star-color', preset.ui.starColor);
        r.setProperty('--success', preset.ui.success);
        r.setProperty('--danger', preset.ui.danger);
        r.setProperty('--cat-accent', preset.ui.catAccent);
      }

      function renderThemeGrid() {
        const grid = document.getElementById('theme-grid');
        if (!grid) return;
        grid.innerHTML = Object.entries(themePresets).map(([key, p]) => {
          const active = settings.theme === key ? ' active' : '';
          const colors = [
            p.terminal.red, p.terminal.green, p.terminal.yellow, p.terminal.blue,
            p.terminal.magenta, p.terminal.cyan, p.terminal.brightRed, p.terminal.brightGreen,
          ];
          const strip = colors.map(c => `<span style="background:${c}"></span>`).join('');
          return `<div class="theme-swatch${active}" data-theme="${key}" style="background:${p.terminal.background}">
            <div class="swatch-strip">${strip}</div>
            <div class="swatch-name" style="color:${p.terminal.foreground}">${p.name}</div>
          </div>`;
        }).join('');
      }

      function renderAgentPermissionControls() {
        const container = document.getElementById('agent-permissions-settings');
        if (!container) return;

        const configurable = agentList.filter(
          (agent) => ['claude', 'codex', 'gemini'].includes(agent.id)
            && Array.isArray(agent.permissionProfiles) && agent.permissionProfiles.length > 0
        );

        container.innerHTML = configurable.map((agent) => {
          const selectId = `agent-permission-${agent.id}`;
          const selected = selectedPermissionProfileId(agent);
          const options = agent.permissionProfiles.map((profile) =>
            `<option value="${profile.id}"${profile.id === selected ? ' selected' : ''}>${profile.label}</option>`
          ).join('');
          return `
            <div class="settings-row agent-permission-row">
              <label for="${selectId}">${agent.name}</label>
              <select id="${selectId}" data-agent-permission="${agent.id}">${options}</select>
              <span class="permission-warning" data-permission-warning="${agent.id}" role="status" aria-live="polite" hidden></span>
            </div>
          `;
        }).join('');

        for (const agent of configurable) updatePermissionWarning(agent.id);
      }

      // Launch options (lib/agents.js launchOptions): Settings holds the default
      // per agent+option; projects.json may override per project.
      function defaultLaunchOption(agentId, optionId) {
        return settings.agentLaunchOptions?.[agentId]?.[optionId] === true;
      }

      function renderAgentLaunchOptionControls() {
        const container = document.getElementById('agent-launch-options-settings');
        if (!container) return;
        const withOptions = agentList.filter(
          (agent) => Array.isArray(agent.launchOptions) && agent.launchOptions.length > 0
        );
        if (withOptions.length === 0) {
          container.innerHTML = '<div class="settings-help">No agent exposes launch options.</div>';
          return;
        }
        container.innerHTML = withOptions.map((agent) => agent.launchOptions.map((opt) => {
          const on = defaultLaunchOption(agent.id, opt.id) ? ' on' : '';
          return `
            <div class="settings-row agent-permission-row">
              <label>${agent.name}</label>
              <span class="toggle-label" data-launch-option-agent="${agent.id}" data-launch-option="${opt.id}" title="${(opt.description || '').replace(/"/g, '&quot;')}">
                <span class="toggle-switch${on}"></span> ${opt.label}
              </span>
            </div>
          `;
        }).join('')).join('');
      }

      function selectedPermissionProfileId(agent) {
        const saved = settings.agentPermissions?.[agent.id];
        return agent.permissionProfiles.some((profile) => profile.id === saved)
          ? saved
          : agent.defaultPermissionProfile;
      }

      function updatePermissionWarning(agentId) {
        const agent = agentList.find((item) => item.id === agentId);
        if (!agent) return;
        const selectedId = selectedPermissionProfileId(agent);
        const profile = agent.permissionProfiles.find((item) => item.id === selectedId);
        const warning = document.querySelector(`[data-permission-warning="${agentId}"]`);
        if (!warning) return;
        warning.textContent = profile?.dangerous ? profile.warning : '';
        warning.hidden = !profile?.dangerous;
      }
      function populateSettingsControls() {
        const el = (id) => document.getElementById(id);
        el('set-remote-hostname').value = settings.remoteHostname || '';
        el('set-font-family').value = settings.font.family;
        el('set-font-size').value = settings.font.size;
        el('set-font-weight').value = settings.font.weight;
        el('switch-ligatures').classList.toggle('on', !!settings.font.ligatures);
        el('set-cursor-style').value = settings.cursor.style;
        el('switch-cursor-blink').classList.toggle('on', !!settings.cursor.blink);
        el('set-line-height').value = settings.terminal.lineHeight;
        el('set-padding').value = settings.terminal.padding;
        el('set-scrollback').value = settings.terminal.scrollback;
        el('switch-copy-on-select').classList.toggle('on', !!settings.behavior.copyOnSelect);
        el('set-right-click').value = settings.behavior.rightClick;
        el('set-bell').value = settings.behavior.bell;
        el('switch-statusline').classList.toggle('on', !settings.statusline || settings.statusline.enabled !== false);
        el('switch-sl-autohook').classList.toggle('on', !settings.statusline || settings.statusline.autoHook !== false);
        el('switch-desktop-notify').classList.toggle('on', !settings.notifications || settings.notifications.desktop !== false);
        renderAgentPermissionControls();
        renderAgentLaunchOptionControls();
      }

      function saveSettings() {
        fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(settings),
        });
      }

      function onSettingChanged() {
        saveSettings();
        const preset = themePresets[settings.theme] || themePresets['default-purple'];
        applyThemeToPage(preset);
        renderThemeGrid();
      }

      // ── Settings event handlers (delegated) ──
      document.addEventListener('click', (e) => {
        // ── Appearance section toggle ──
        if (e.target.closest('#appearance-toggle-btn')) {
          appearanceExpanded = !appearanceExpanded;
          const body = document.getElementById('appearance-body');
          const arrow = document.getElementById('appearance-arrow');
          if (body) body.classList.toggle('collapsed', !appearanceExpanded);
          if (arrow) arrow.classList.toggle('open', appearanceExpanded);
          return;
        }

        // ── Theme swatch click ──
        const swatch = e.target.closest('.theme-swatch');
        if (swatch) {
          settings.theme = swatch.dataset.theme;
          onSettingChanged();
          return;
        }

        // ── Toggle switches ──
        const launchToggle = e.target.closest('[data-launch-option]');
        if (launchToggle) {
          const agentId = launchToggle.dataset.launchOptionAgent;
          const optionId = launchToggle.dataset.launchOption;
          const next = !defaultLaunchOption(agentId, optionId);
          settings.agentLaunchOptions = {
            ...(settings.agentLaunchOptions || {}),
            [agentId]: { ...((settings.agentLaunchOptions || {})[agentId] || {}), [optionId]: next },
          };
          launchToggle.querySelector('.toggle-switch').classList.toggle('on', next);
          onSettingChanged();
          return;
        }
        if (e.target.closest('#toggle-ligatures')) {
          settings.font.ligatures = !settings.font.ligatures;
          document.getElementById('switch-ligatures').classList.toggle('on', settings.font.ligatures);
          onSettingChanged();
          return;
        }
        if (e.target.closest('#toggle-cursor-blink')) {
          settings.cursor.blink = !settings.cursor.blink;
          document.getElementById('switch-cursor-blink').classList.toggle('on', settings.cursor.blink);
          onSettingChanged();
          return;
        }
        if (e.target.closest('#toggle-copy-on-select')) {
          settings.behavior.copyOnSelect = !settings.behavior.copyOnSelect;
          document.getElementById('switch-copy-on-select').classList.toggle('on', settings.behavior.copyOnSelect);
          onSettingChanged();
          return;
        }
        if (e.target.closest('#toggle-statusline')) {
          const on = !settings.statusline || settings.statusline.enabled !== false;
          settings.statusline = { ...(settings.statusline || {}), enabled: !on };
          document.getElementById('switch-statusline').classList.toggle('on', !on);
          onSettingChanged();
          return;
        }
        if (e.target.closest('#toggle-sl-autohook')) {
          const on = !settings.statusline || settings.statusline.autoHook !== false;
          settings.statusline = { ...(settings.statusline || {}), autoHook: !on };
          document.getElementById('switch-sl-autohook').classList.toggle('on', !on);
          onSettingChanged();
          return;
        }
        if (e.target.closest('#toggle-desktop-notify')) {
          const on = !settings.notifications || settings.notifications.desktop !== false;
          settings.notifications = { ...(settings.notifications || {}), desktop: !on };
          document.getElementById('switch-desktop-notify').classList.toggle('on', !on);
          onSettingChanged();
          return;
        }

        // ── Reset to defaults ──
        if (e.target.closest('#reset-settings-btn')) {
          fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
          }).then(() => fetch('/api/settings').then(r => r.json())).then(s => {
            settings = s;
            populateSettingsControls();
            const preset = themePresets[settings.theme] || themePresets['default-purple'];
            applyThemeToPage(preset);
            renderThemeGrid();
          });
          return;
        }

        // ── Hotkeys section toggle ──
        if (e.target.closest('#hotkeys-toggle-btn')) {
          hotkeysExpanded = !hotkeysExpanded;
          const body = document.getElementById('hotkeys-body');
          const arrow = document.getElementById('hotkeys-arrow');
          if (body) body.classList.toggle('collapsed', !hotkeysExpanded);
          if (arrow) arrow.classList.toggle('open', hotkeysExpanded);
          return;
        }

        // ── Hotkey combo recording ──
        const hotkeyCombo = e.target.closest('.hotkey-combo');
        if (hotkeyCombo) {
          const row = hotkeyCombo.closest('.hotkey-row');
          startRecording(hotkeyCombo, row.dataset.id);
          return;
        }

        // ── Hotkey toggle enabled/disabled ──
        const hotkeyToggle = e.target.closest('.hotkey-toggle');
        if (hotkeyToggle) {
          const row = hotkeyToggle.closest('.hotkey-row');
          const binding = hotkeyConfig.bindings.find(b => b.id === row.dataset.id);
          if (binding) {
            binding.enabled = binding.enabled === false ? true : false;
            saveHotkeys();
            renderHotkeys();
          }
          return;
        }

        // ── Hotkey delete ──
        const hotkeyDelete = e.target.closest('.hotkey-delete');
        if (hotkeyDelete) {
          const row = hotkeyDelete.closest('.hotkey-row');
          hotkeyConfig.bindings = hotkeyConfig.bindings.filter(b => b.id !== row.dataset.id);
          saveHotkeys();
          renderHotkeys();
          return;
        }

        // ── Add new hotkey binding ──
        if (e.target.closest('#hotkey-add-btn')) {
          const newId = 'hk_' + Date.now();
          hotkeyConfig.bindings.push({
            id: newId, combo: '', action: '', label: '', enabled: true,
          });
          saveHotkeys();
          renderHotkeys();
          const newRow = document.querySelector(`.hotkey-row[data-id="${newId}"]`);
          if (newRow) startRecording(newRow.querySelector('.hotkey-combo'), newId);
          return;
        }

        // ── New Project button ──
        if (e.target.closest('#new-project-btn')) {
          showNewProjectForm();
          return;
        }

        // ── New Project form actions ──
        if (e.target.closest('#new-project-create')) {
          createNewProject();
          return;
        }
        if (e.target.closest('#new-project-cancel')) {
          render();
          return;
        }

        // ── Modifier+click and Alt+click on project links ──
        const projectLink = e.target.closest('.project-card a, .favorites-bar a');
        if (projectLink) {
          // Alt+click → plain terminal (no agent)
          if (e.altKey) {
            e.preventDefault();
            const url = new URL(projectLink.href);
            url.searchParams.delete('agent');
            url.searchParams.delete('claude');
            window.open(url.toString(), '_blank');
            return;
          }

          const mod = hotkeyConfig.modifierClick?.modifier || 'RightShift';
          let modifierHeld = false;
          if (mod === 'RightShift') modifierHeld = rightShiftHeld;
          else if (mod === 'CtrlShift') modifierHeld = e.ctrlKey && e.shiftKey;
          else if (mod === 'AltShift') modifierHeld = e.altKey && e.shiftKey;

          if (modifierHeld) {
            e.preventDefault();
            const args = hotkeyConfig.modifierClick?.agentArgs || hotkeyConfig.modifierClick?.claudeArgs || '--dangerously-skip-permissions';
            const url = new URL(projectLink.href);
            url.searchParams.set('agentBypass', '1');
            if (args) url.searchParams.set('agentArgs', args);
            window.open(url.toString(), '_blank');
            return;
          }
        }

        const starBtn = e.target.closest('.star-btn');
        if (starBtn) { toggleFavorite(starBtn.dataset.cwd); return; }

        const gearBtn = e.target.closest('.gear-btn');
        if (gearBtn) { showSettingsPopover(gearBtn); return; }

        const agentBtn = e.target.closest('.agent-btn');
        if (agentBtn) { showAgentPicker(agentBtn); return; }

        const catBtn = e.target.closest('.cat-btn');
        if (catBtn) { showPicker(catBtn); return; }

        // Close picker if clicking outside
        if (openPicker && !e.target.closest('.cat-picker')) closePicker();
        if (openAgentPicker && !e.target.closest('.agent-picker')) closeAgentPicker();
        if (openSettingsPopover && !e.target.closest('.settings-popover')) closeSettingsPopover();
      });

      // ── Settings change handlers for selects/inputs ──
      document.addEventListener('change', (e) => {
        const permissionAgentId = e.target.dataset.agentPermission;
        if (permissionAgentId) {
          settings.agentPermissions = {
            ...(settings.agentPermissions || {}),
            [permissionAgentId]: e.target.value,
          };
          updatePermissionWarning(permissionAgentId);
          onSettingChanged();
          return;
        }
        if (e.target.id === 'set-remote-hostname') { settings.remoteHostname = e.target.value.trim(); onSettingChanged(); refreshNetworkInfoDisplay(); }
        if (e.target.id === 'set-font-family') { settings.font.family = e.target.value; onSettingChanged(); }
        if (e.target.id === 'set-font-size') { settings.font.size = parseInt(e.target.value) || 14; onSettingChanged(); }
        if (e.target.id === 'set-font-weight') { settings.font.weight = e.target.value; onSettingChanged(); }
        if (e.target.id === 'set-cursor-style') { settings.cursor.style = e.target.value; onSettingChanged(); }
        if (e.target.id === 'set-line-height') { settings.terminal.lineHeight = parseFloat(e.target.value) || 1.0; onSettingChanged(); }
        if (e.target.id === 'set-padding') { settings.terminal.padding = parseInt(e.target.value) || 4; onSettingChanged(); }
        if (e.target.id === 'set-scrollback') { settings.terminal.scrollback = parseInt(e.target.value) || 10000; onSettingChanged(); }
        if (e.target.id === 'set-right-click') { settings.behavior.rightClick = e.target.value; onSettingChanged(); }
        if (e.target.id === 'set-bell') { settings.behavior.bell = e.target.value; onSettingChanged(); }
        if (e.target.id === 'set-default-agent') { settings.defaultAgent = e.target.value; onSettingChanged(); render(); }
      });

      function renderFavorites() {
        const bar = document.getElementById('favorites-bar');
        const favProjects = projects.filter(p => favorites.has(p.cwd))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
        if (favProjects.length === 0) {
          bar.innerHTML = '<span class="empty">Star a project below to pin it here</span>';
        } else {
          bar.innerHTML = favProjects.map(p =>
            `<a href="${escapeHtml(makeUrl(p.cwd))}" target="_blank">${escapeHtml(p.name)}</a>`
          ).join('');
        }
      }

      function renderCard(p) {
        const active = favorites.has(p.cwd) ? ' active' : '';
        const cat = catAssignments[p.cwd];
        const catLabel = cat ? '\u2630' : '+';
        const catClass = cat ? ' assigned' : '';
        const effectiveAgentId = p.agent || settings.defaultAgent || 'claude';
        const agentInfo = agentList.find(a => a.id === effectiveAgentId);
        const agentColor = (agentInfo && agentInfo.color) || '#888888';
        const agentName = (agentInfo && agentInfo.name) || effectiveAgentId;
        const agentTitle = p.agent ? `Agent: ${agentName}` : `Agent: ${agentName} (default)`;
        return `<div class="project-card">
          <a href="${escapeHtml(makeUrl(p.cwd))}" target="_blank">${escapeHtml(p.name)}</a>
          <span style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <button class="gear-btn" data-cwd="${escapeHtml(p.cwd)}"
              title="Project settings">⚙</button>
            <button class="agent-btn${p.agent ? ' assigned' : ''}" data-cwd="${escapeHtml(p.cwd)}"
              title="${agentTitle}" style="color:${agentColor}">\u25cf</button>
            <button class="cat-btn${catClass}" data-cwd="${escapeHtml(p.cwd)}"
              title="Set category">${catLabel}</button>
            <button class="star-btn${active}" data-cwd="${escapeHtml(p.cwd)}"
              title="${favorites.has(p.cwd) ? 'Remove from favorites' : 'Add to favorites'}"
            >${favorites.has(p.cwd) ? '\u2605' : '\u2606'}</button>
          </span>
        </div>`;
      }

      const newProjectBtn = '<div class="new-project-card" id="new-project-btn"><span class="plus">+</span> New Project</div>';

      function renderSections() {
        const container = document.getElementById('project-sections');
        const grouped = {};
        const uncategorized = [];
        for (const p of projects) {
          const cat = catAssignments[p.cwd];
          if (cat) {
            if (!grouped[cat]) grouped[cat] = [];
            grouped[cat].push(p);
          } else {
            uncategorized.push(p);
          }
        }
        const allCats = Object.keys(grouped).sort((a, b) =>
          a.localeCompare(b, undefined, { sensitivity: 'base' })
        );

        let html = '';
        for (const cat of allCats) {
          const items = grouped[cat];
          if (!items || items.length === 0) continue;
          html += `<div class="category-section">
            <div class="category-header">${escapeHtml(cat)} <span class="count">${items.length}</span></div>
            <div class="project-grid">${items.map(renderCard).join('')}</div>
          </div>`;
        }
        const label = allCats.length > 0 ? 'Uncategorized' : 'All Projects';
        const cards = uncategorized.map(renderCard).join('') + newProjectBtn;
        html += `<div class="category-section">
          <div class="category-header">${label} <span class="count">${uncategorized.length}</span></div>
          <div class="project-grid">${cards}</div>
        </div>`;
        container.innerHTML = html;
      }

      function render() {
        renderFavorites();
        renderSections();
      }

      function showNewProjectForm() {
        const btn = document.getElementById('new-project-btn');
        if (!btn) return;
        btn.outerHTML = `<div class="new-project-form" id="new-project-form">
          <input type="text" id="new-project-name" placeholder="Project name..." autofocus>
          <button id="new-project-create">Create</button>
          <button class="cancel-btn" id="new-project-cancel">&times;</button>
        </div>`;
        const input = document.getElementById('new-project-name');
        input.focus();
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') createNewProject();
          if (e.key === 'Escape') render();
        });
      }

      async function createNewProject() {
        const input = document.getElementById('new-project-name');
        const name = input?.value.trim();
        if (!name) return;
        try {
          const res = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          });
          const data = await res.json();
          if (!res.ok) {
            if (res.status === 409) {
              // Folder exists — open it anyway
              window.open(makeUrl(data.cwd), '_blank');
              render();
              return;
            }
            input.value = '';
            input.placeholder = data.error || 'Error';
            return;
          }
          projects.push({ name: data.name, cwd: data.cwd });
          projects.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
          render();
          window.open(makeUrl(data.cwd), '_blank');
        } catch (err) {
          input.value = '';
          input.placeholder = 'Network error';
        }
      }

      function toggleFavorite(cwd) {
        if (favorites.has(cwd)) favorites.delete(cwd);
        else favorites.add(cwd);
        render();
        fetch('/api/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify([...favorites]),
        });
      }

      function saveCategories() {
        fetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ assignments: catAssignments, order: catOrder }),
        });
      }

      function assignCategory(cwd, category) {
        if (category) {
          catAssignments[cwd] = category;
          if (!catOrder.includes(category)) catOrder.push(category);
        } else {
          delete catAssignments[cwd];
        }
        saveCategories();
        render();
      }

      // ── Hotkey management ──
      function saveHotkeys() {
        fetch('/api/hotkeys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(hotkeyConfig),
        });
      }

      function renderHotkeys() {
        const list = document.getElementById('hotkey-list');
        if (!list) return;
        list.innerHTML = hotkeyConfig.bindings.map(b => `
          <div class="hotkey-row${b.enabled === false ? ' disabled' : ''}" data-id="${b.id}">
            <span class="hotkey-combo" title="Click to re-record">${b.combo || 'Click to set'}</span>
            <input class="hotkey-label-input" value="${(b.label || '').replace(/"/g, '&quot;')}" placeholder="Label...">
            <input class="hotkey-action-input" value="${(b.action || '').replace(/"/g, '&quot;')}" placeholder="Command (e.g. /clear)">
            <button class="hotkey-toggle${b.enabled === false ? ' off' : ''}" title="Toggle enabled">&#x25CF;</button>
            <button class="hotkey-delete" title="Delete">&times;</button>
          </div>
        `).join('');

        const modSelect = document.getElementById('modifier-select');
        const argsInput = document.getElementById('agent-args-input');
        if (modSelect) modSelect.value = hotkeyConfig.modifierClick?.modifier || 'RightShift';
        if (argsInput) argsInput.value = hotkeyConfig.modifierClick?.agentArgs || hotkeyConfig.modifierClick?.claudeArgs || '--dangerously-skip-permissions';

        list.querySelectorAll('.hotkey-label-input').forEach(input => {
          input.addEventListener('blur', () => {
            const row = input.closest('.hotkey-row');
            const binding = hotkeyConfig.bindings.find(b => b.id === row.dataset.id);
            if (binding) { binding.label = input.value.trim(); saveHotkeys(); }
          });
        });
        list.querySelectorAll('.hotkey-action-input').forEach(input => {
          input.addEventListener('blur', () => {
            const row = input.closest('.hotkey-row');
            const binding = hotkeyConfig.bindings.find(b => b.id === row.dataset.id);
            if (binding) { binding.action = input.value.trim(); saveHotkeys(); }
          });
        });
      }

      // ── Key recorder ──
      let recordingTarget = null;

      function startRecording(comboEl, bindingId) {
        stopRecording();
        recordingTarget = { el: comboEl, bindingId };
        comboEl.classList.add('recording');
        comboEl.textContent = 'Press keys...';
        document.addEventListener('keydown', onRecordKeyDown, true);
      }

      function stopRecording() {
        if (!recordingTarget) return;
        recordingTarget.el.classList.remove('recording');
        document.removeEventListener('keydown', onRecordKeyDown, true);
        recordingTarget = null;
      }

      function onRecordKeyDown(e) {
        e.preventDefault();
        e.stopPropagation();
        if (e.key === 'Escape') { stopRecording(); renderHotkeys(); return; }
        const combo = normalizeCombo(e);
        if (!combo) return;

        if (RESERVED_COMBOS.has(combo)) {
          recordingTarget.el.textContent = 'Reserved!';
          setTimeout(() => { if (recordingTarget) recordingTarget.el.textContent = 'Press keys...'; }, 1000);
          return;
        }
        const duplicate = hotkeyConfig.bindings.find(b =>
          b.combo === combo && b.id !== recordingTarget.bindingId
        );
        if (duplicate) {
          recordingTarget.el.textContent = 'Already used!';
          setTimeout(() => { if (recordingTarget) recordingTarget.el.textContent = 'Press keys...'; }, 1000);
          return;
        }

        const binding = hotkeyConfig.bindings.find(b => b.id === recordingTarget.bindingId);
        if (binding) {
          binding.combo = combo;
          saveHotkeys();
        }
        stopRecording();
        renderHotkeys();
      }

      // Category picker dropdown
      let openPicker = null;
      function closePicker() {
        if (openPicker) { openPicker.remove(); openPicker = null; }
      }

      function showPicker(btn) {
        closePicker();
        closeSettingsPopover();
        const cwd = btn.dataset.cwd;
        const currentCat = catAssignments[cwd] || null;
        const picker = document.createElement('div');
        picker.className = 'cat-picker';

        const catCounts = {};
        for (const c of Object.values(catAssignments)) {
          catCounts[c] = (catCounts[c] || 0) + 1;
        }

        let items = '';
        const sortedCats = [...catOrder].sort((a, b) =>
          a.localeCompare(b, undefined, { sensitivity: 'base' })
        );
        for (const cat of sortedCats) {
          const cls = cat === currentCat ? ' active' : '';
          const count = catCounts[cat] || 0;
          const del = count === 0
            ? ` <span class="cat-delete" data-del-cat="${cat.replace(/"/g, '&quot;')}" title="Delete empty category">\u00d7</span>`
            : '';
          items += `<button class="cat-picker-item${cls}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}${del}</button>`;
        }
        if (currentCat) {
          if (catOrder.length > 0) items += '<div class="cat-picker-sep"></div>';
          items += `<button class="cat-picker-item remove" data-cat="">Remove category</button>`;
        }
        items += '<div class="cat-picker-sep"></div>';
        items += `<div class="cat-picker-input">
          <input type="text" placeholder="New category..." id="new-cat-input">
          <button id="new-cat-add">Add</button>
        </div>`;

        picker.innerHTML = items;
        document.body.appendChild(picker);
        openPicker = picker;

        placePopover(picker, btn);

        picker.addEventListener('click', (e) => {
          const del = e.target.closest('.cat-delete');
          if (del) {
            e.stopPropagation();
            const delCat = del.dataset.delCat;
            catOrder = catOrder.filter(c => c !== delCat);
            saveCategories();
            showPicker(btn);
            return;
          }
          const item = e.target.closest('.cat-picker-item');
          if (item) {
            assignCategory(cwd, item.dataset.cat || null);
            closePicker();
            return;
          }
          if (e.target.id === 'new-cat-add') {
            const input = document.getElementById('new-cat-input');
            const name = input.value.trim();
            if (name) {
              assignCategory(cwd, name);
              closePicker();
            }
          }
        });

        setTimeout(() => {
          const input = document.getElementById('new-cat-input');
          if (input) {
            input.focus();
            input.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                const name = input.value.trim();
                if (name) { assignCategory(cwd, name); closePicker(); }
              }
            });
          }
        }, 0);
      }

      let openAgentPicker = null;
      function closeAgentPicker() {
        if (openAgentPicker) { openAgentPicker.remove(); openAgentPicker = null; }
      }

      function agentItemsHtml(current) {
        let items = `<button class="cat-picker-item${current === null ? ' active' : ''}" data-agent="">Default (${settings.defaultAgent || 'claude'})</button>`;
        for (const a of agentList) {
          const cls = (current === a.id ? ' active' : '') + (a.installed ? '' : ' disabled');
          const suffix = a.installed ? '' : ' (not installed)';
          items += `<button class="cat-picker-item${cls}" data-agent="${a.id}">
            <span style="color:${a.color}">●</span> ${a.name}${suffix}</button>`;
        }
        return items;
      }

      // Per-project launch-option overrides for the project's effective agent:
      // a tri-state select (inherit Settings default / on / off) per option.
      function launchOptionsHtml(proj) {
        const agentId = proj.agent || settings.defaultAgent || 'claude';
        const agent = agentList.find((a) => a.id === agentId);
        if (!agent || !Array.isArray(agent.launchOptions) || agent.launchOptions.length === 0) return '';
        const overrides = proj.launchOptions || {};
        return agent.launchOptions.map((opt) => {
          const current = overrides[opt.id] === true ? 'on' : overrides[opt.id] === false ? 'off' : 'inherit';
          const inheritLabel = `Default (${defaultLaunchOption(agent.id, opt.id) ? 'on' : 'off'})`;
          const option = (value, label) =>
            `<option value="${value}"${current === value ? ' selected' : ''}>${label}</option>`;
          return `
            <div class="cat-picker-input sp-launch-option" title="${(opt.description || '').replace(/"/g, '&quot;')}">
              <label style="font-size:11px;flex:1">${opt.label}</label>
              <select data-sp-launch-option="${opt.id}">
                ${option('inherit', inheritLabel)}${option('on', 'On')}${option('off', 'Off')}
              </select>
            </div>
          `;
        }).join('');
      }

      function placePopover(picker, btn) {
        const r = btn.getBoundingClientRect();
        picker.style.left = Math.min(r.left, window.innerWidth - 180) + 'px';
        picker.style.top = (r.bottom + 4) + 'px';
        requestAnimationFrame(() => {
          const pr = picker.getBoundingClientRect();
          if (pr.bottom > window.innerHeight - 8) {
            picker.style.top = Math.max(8, r.top - pr.height - 4) + 'px';
          }
        });
      }

      function showAgentPicker(btn) {
        closeAgentPicker();
        closePicker();
        closeSettingsPopover();
        const cwd = btn.dataset.cwd;
        const proj = projects.find(p => p.cwd === cwd);
        const current = (proj && proj.agent) || null;
        const picker = document.createElement('div');
        picker.className = 'cat-picker agent-picker';

        const items = agentItemsHtml(current);
        picker.innerHTML = items;
        document.body.appendChild(picker);
        openAgentPicker = picker;

        placePopover(picker, btn);

        picker.addEventListener('click', async (e) => {
          const item = e.target.closest('.cat-picker-item');
          if (!item || item.classList.contains('disabled')) return;
          const agent = item.dataset.agent || null;
          try {
            const res = await fetch('/api/project-agent', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cwd, agent }),
            });
            if (res.ok && proj) proj.agent = agent;
          } catch {}
          closeAgentPicker();
          render();
        });
      }

      let openSettingsPopover = null;
      function closeSettingsPopover() {
        if (openSettingsPopover) { openSettingsPopover.remove(); openSettingsPopover = null; }
      }

      /** Re-fetch everything a rename/delete can touch, then re-render. */
      async function reloadProjects() {
        const [proj, favs, cats] = await Promise.all([
          fetch('/api/projects').then(r => r.json()),
          fetch('/api/favorites').then(r => r.json()),
          fetch('/api/categories').then(r => r.json()),
        ]);
        projects = proj;
        favorites = new Set(favs);
        catAssignments = cats.assignments || {};
        catOrder = cats.order || [];
        render();
      }

      function showSettingsPopover(btn) {
        closeSettingsPopover();
        closePicker();
        closeAgentPicker();
        const cwd = btn.dataset.cwd;
        const proj = projects.find(p => p.cwd === cwd);
        if (!proj) return;
        const currentCat = catAssignments[cwd] || null;

        const picker = document.createElement('div');
        picker.className = 'cat-picker settings-popover';

        let catItems = '';
        const sortedCats = [...catOrder].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
        for (const cat of sortedCats) {
          const cls = cat === currentCat ? ' active' : '';
          catItems += `<button class="cat-picker-item${cls}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
        }
        if (currentCat) {
          catItems += `<button class="cat-picker-item remove" data-cat="">Remove category</button>`;
        }

        picker.innerHTML = `
          <div class="sp-label">Rename</div>
          <div class="cat-picker-input">
            <input type="text" id="sp-rename-input" value="${proj.name.replace(/"/g, '&quot;')}">
            <button id="sp-rename-save">Save</button>
          </div>
          <div class="cat-picker-sep"></div>
          <div class="sp-label">Agent</div>
          ${agentItemsHtml(proj.agent || null)}
          ${launchOptionsHtml(proj)}
          <div class="cat-picker-sep"></div>
          <div class="sp-label">Category</div>
          ${catItems || '<div class="sp-label" style="text-transform:none">No categories yet</div>'}
          <div class="cat-picker-sep"></div>
          <button class="cat-picker-item sp-delete" id="sp-delete">Delete…</button>
          <div class="sp-error" id="sp-error" hidden></div>
        `;
        document.body.appendChild(picker);
        openSettingsPopover = picker;
        placePopover(picker, btn);

        const errEl = picker.querySelector('#sp-error');
        const showError = (msg) => { errEl.textContent = msg; errEl.hidden = false; };

        async function doRename() {
          const newName = picker.querySelector('#sp-rename-input').value.trim();
          if (!newName || newName === proj.name) return;
          try {
            const res = await fetch('/api/projects', {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cwd, newName }),
            });
            const data = await res.json();
            if (!res.ok) return showError(data.error || `Rename failed (${res.status})`);
            closeSettingsPopover();
            await reloadProjects();
          } catch (err) {
            showError('Rename failed: ' + err.message);
          }
        }

        async function doDelete() {
          try {
            const res = await fetch('/api/projects', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cwd }),
            });
            const data = await res.json();
            if (!res.ok) return showError(data.error || `Delete failed (${res.status})`);
            closeSettingsPopover();
            await reloadProjects();
          } catch (err) {
            showError('Delete failed: ' + err.message);
          }
        }

        picker.addEventListener('click', async (e) => {
          if (e.target.id === 'sp-rename-save') return doRename();

          if (e.target.id === 'sp-delete') {
            // Swap the delete button for an inline confirm. Stop propagation:
            // the swap detaches e.target, so the document-level outside-click
            // handler would see closest('.settings-popover') === null and
            // close the popover before the confirm can be used.
            e.stopPropagation();
            e.target.outerHTML = `<span class="cat-picker-input" style="display:flex;align-items:center;gap:6px;padding:4px 10px">
              <span style="font-size:11px">Move <b>${proj.name.replace(/</g, '&lt;')}</b> to Recycle Bin?</span>
              <button id="sp-delete-yes">Yes</button>
              <button id="sp-delete-no">No</button>
            </span>`;
            return;
          }
          if (e.target.id === 'sp-delete-yes') return doDelete();
          if (e.target.id === 'sp-delete-no') { closeSettingsPopover(); return; }

          const agentItem = e.target.closest('.cat-picker-item[data-agent]');
          if (agentItem && !agentItem.classList.contains('disabled')) {
            const agent = agentItem.dataset.agent || null;
            try {
              const res = await fetch('/api/project-agent', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cwd, agent }),
              });
              if (res.ok) proj.agent = agent;
            } catch {}
            closeSettingsPopover();
            render();
            return;
          }

          const catItem = e.target.closest('.cat-picker-item[data-cat]');
          if (catItem) {
            assignCategory(cwd, catItem.dataset.cat || null);
            closeSettingsPopover();
            return;
          }
        });

        picker.addEventListener('change', async (e) => {
          const optionId = e.target.dataset.spLaunchOption;
          if (!optionId) return;
          const value = e.target.value === 'on' ? true : e.target.value === 'off' ? false : null;
          try {
            const res = await fetch('/api/project-launch-option', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cwd, option: optionId, value }),
            });
            const data = await res.json();
            if (!res.ok) return showError(data.error || `Save failed (${res.status})`);
            proj.launchOptions = data.launchOptions || {};
          } catch (err) {
            showError('Save failed: ' + err.message);
          }
        });

        const renameInput = picker.querySelector('#sp-rename-input');
        renameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') doRename();
          if (e.key === 'Escape') closeSettingsPopover();
        });
      }

      // ── Hotkey modifier-click config change handlers ──
      document.getElementById('modifier-select')?.addEventListener('change', (e) => {
        if (!hotkeyConfig.modifierClick) hotkeyConfig.modifierClick = {};
        hotkeyConfig.modifierClick.modifier = e.target.value;
        saveHotkeys();
      });
      document.getElementById('agent-args-input')?.addEventListener('blur', (e) => {
        if (!hotkeyConfig.modifierClick) hotkeyConfig.modifierClick = {};
        hotkeyConfig.modifierClick.agentArgs = e.target.value.trim();
        delete hotkeyConfig.modifierClick.claudeArgs;
        saveHotkeys();
      });

      // Re-enable scrolling when this tab becomes active
      if (window.electronAPI?.onTabActivated) {
        window.electronAPI.onTabActivated(() => {
          document.documentElement.style.overflow = '';
          requestAnimationFrame(() => {
            document.documentElement.style.overflow = 'auto';
          });
        });
      }

      Promise.all([
        fetch('/api/projects').then(r => r.json()),
        fetch('/api/favorites').then(r => r.json()),
        fetch('/api/categories').then(r => r.json()),
        fetch('/api/hotkeys').then(r => r.json()),
        fetch('/api/settings').then(r => r.json()),
        fetch('/api/theme-presets').then(r => r.json()),
        fetch('/api/version').then(r => r.json()),
        fetch('/api/network-info').then(r => r.json()).catch(() => ({})),
        fetch('/api/auth-status').then(r => r.json()).catch(() => ({ passwordSet: false })),
        fetch('/api/agents').then(r => r.json()).catch(() => []),
      ]).then(([proj, favs, cats, hotkeys, sett, presets, ver, net, auth, agentsResp]) => {
        projects = proj;
        favorites = new Set(favs);
        catAssignments = cats.assignments || {};
        catOrder = cats.order || [];
        hotkeyConfig = hotkeys;
        settings = sett;
        themePresets = presets;
        agentList = agentsResp;
        const agentSel = document.getElementById('set-default-agent');
        if (agentSel) {
          agentSel.innerHTML = agentList.map(a =>
            `<option value="${a.id}"${a.installed ? '' : ' disabled'}>${a.name}${a.installed ? '' : ' (not installed)'}</option>`
          ).join('');
          agentSel.value = settings.defaultAgent || 'claude';
        }
        document.getElementById('version-label').textContent = 'v' + ver.version;
        networkInfo = net;
        refreshNetworkInfoDisplay();
        document.getElementById('restart-btn').addEventListener('click', () => {
          // IPC, not /api — restarting must hit only this window's process.
          // In a plain browser (no bridge) the button does nothing.
          if (window.electronRemote) window.electronRemote.restart().catch(() => {});
        });
        const $serversBtn = document.getElementById('servers-btn');
        // Electron-only: in a plain browser there is no picker to open.
        if (window.electronRemote) {
          $serversBtn.addEventListener('click', () => {
            window.electronRemote.pickerOpen().catch(() => {});
          });
        } else {
          $serversBtn.style.display = 'none';
        }
        const qrOverlay = document.getElementById('qr-overlay');
        document.getElementById('qr-close-btn').addEventListener('click', () => { qrOverlay.style.display = 'none'; });
        qrOverlay.addEventListener('click', (e) => { if (e.target === qrOverlay) qrOverlay.style.display = 'none'; });
        render();
        renderHotkeys();
        renderThemeGrid();
        populateSettingsControls();
        wireRemoteAccessSettings(auth && auth.passwordSet);
        wireRemoteServerSettings();
        const preset = themePresets[settings.theme] || themePresets['default-purple'];
        applyThemeToPage(preset);
      });

      function wireRemoteServerSettings() {
        // The IPC bridge only exists inside the Electron app — in a plain
        // browser (phone/tablet) the section stays hidden.
        if (!window.electronRemote) return;
        document.getElementById('remote-connect-section').style.display = '';
        const $label = document.getElementById('remote-connected-label');

        window.electronRemote.getConfig().then((cfg) => {
          if (!cfg) return;
          $label.textContent = cfg.name
            ? `Connected to ${cfg.name}${cfg.remoteServer ? ` (${cfg.remoteServer})` : ''}`
            : 'Connected to this machine';
        }).catch(() => {});

        // Opens the picker, which spawns a separate process — this window
        // keeps running on its own server.
        document.getElementById('remote-switch-btn').addEventListener('click', () => {
          window.electronRemote.pickerOpen().catch(() => {});
        });
      }

      function wireRemoteAccessSettings(passwordSet) {
        const $input = document.getElementById('set-remote-password');
        const $btn = document.getElementById('set-password-btn');
        const $status = document.getElementById('set-password-status');

        if (passwordSet) {
          $input.placeholder = '••••• (change)';
          $status.textContent = 'Set';
          $status.style.color = 'var(--success, #50c878)';
        }

        $btn.addEventListener('click', async () => {
          const pwd = $input.value;
          if (!pwd || pwd.length < 12) {
            $status.textContent = 'Min 12 characters';
            $status.style.color = 'var(--danger, #e05555)';
            return;
          }
          try {
            const res = await fetch('/api/auth-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: pwd }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              $status.textContent = err.error || 'Failed';
              $status.style.color = 'var(--danger, #e05555)';
              return;
            }
            $input.value = '';
            $input.placeholder = '••••• (change)';
            $status.textContent = 'Saved';
            $status.style.color = 'var(--success, #50c878)';
          } catch {
            $status.textContent = 'Network error';
            $status.style.color = 'var(--danger, #e05555)';
          }
        });

        if (!passwordSet) showPasswordSetupModal();
      }

      function showPasswordSetupModal() {
        const $overlay = document.getElementById('password-setup-overlay');
        const $input = document.getElementById('setup-password-input');
        const $error = document.getElementById('setup-password-error');
        const $save = document.getElementById('setup-password-save');
        const $skip = document.getElementById('setup-password-skip');
        $overlay.style.display = 'flex';
        setTimeout(() => $input.focus(), 50);

        function close() {
          $overlay.style.display = 'none';
          $input.value = '';
          $error.style.display = 'none';
        }

        async function save() {
          const pwd = $input.value;
          if (!pwd || pwd.length < 12) {
            $error.textContent = 'Password must be at least 12 characters.';
            $error.style.display = 'block';
            return;
          }
          try {
            const res = await fetch('/api/auth-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: pwd }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              $error.textContent = err.error || 'Failed to save.';
              $error.style.display = 'block';
              return;
            }
            document.getElementById('set-password-status').textContent = 'Set';
            document.getElementById('set-password-status').style.color = 'var(--success, #50c878)';
            document.getElementById('set-remote-password').placeholder = '••••• (change)';
            close();
          } catch {
            $error.textContent = 'Network error.';
            $error.style.display = 'block';
          }
        }

        $save.addEventListener('click', save);
        $skip.addEventListener('click', close);
        $input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
      }
    }
  </script>
</body>
</html>
