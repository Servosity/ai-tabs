<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ai-tabs — locked</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #1a1b1e; color: #d4d4d8;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .panel { text-align: center; }
  .lock-icon { font-size: 44px; margin-bottom: 18px; }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .by { font-size: 13px; color: #8b8b92; margin-bottom: 28px; }
  button {
    font-size: 14px; padding: 10px 22px; border-radius: 6px; border: none;
    background: #3b82f6; color: #fff; cursor: pointer;
  }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
  <div class="panel">
    <div class="lock-icon">🔒</div>
    <h1>Another client is in control</h1>
    <div class="by" id="by"></div>
    <button id="take">Take control</button>
  </div>
  <script>
    const by = new URLSearchParams(location.search).get('by') || 'another client';
    document.getElementById('by').textContent =
      by === 'local' ? 'Controlled locally on the server machine' : 'Controlled from ' + by;
    document.getElementById('take').addEventListener('click', () => {
      window.electronAPI.claimControl();
    });
  </script>
</body>
</html>
